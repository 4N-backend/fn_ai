server:
  port: 18081  # 게이트웨이 서비스가 실행될 포트 번호

spring:
  main:
    web-application-type: reactive  # Spring 애플리케이션이 리액티브 웹 애플리케이션으로 설정됨
  application:
    name: gateway-service  # 애플리케이션 이름을 'gateway-service'로 설정
  cloud:
    gateway:
      routes: # Spring Cloud Gateway의 라우팅 설정
        - id: company-service  # 라우트 식별자
          uri: lb://company-service
          predicates:
            - Path=/api/companies/**
          filters:
            - RewritePath=/api/companies/(?<segment>.*), /${segment}
        - id: delivery-service  # 라우트 식별자
          uri: lb://delivery-service
          predicates:
            - Path=/api/deliveries/**
          filters:
            - RewritePath=/api/deliveries/(?<segment>.*), /${segment}
        - id: hub-service  # 라우트 식별자
          uri: lb://hub-service
          predicates:
            - Path=/api/hubs/**
          filters:
            - RewritePath=/api/hubs/(?<segment>.*), /${segment}
        - id: notification-service  # 라우트 식별자
          uri: lb://notification-service
          predicates:
            - Path=/api/slacks/**
          filters:
            - RewritePath=/api/slacks/(?<segment>.*), /${segment}
        - id: order-service  # 라우트 식별자
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders/(?<segment>.*), /${segment}
        - id: user-service  # 라우트 식별자
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/user/(?<segment>.*), /${segment}
        - id: product-service  # 라우트 식별자
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - RewritePath=/api/products/(?<segment>.*), /${segment}
        - id: auth-service  # 라우트 식별자
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
      discovery:
        locator:
          enabled: true  # 서비스 디스커버리를 통해 동적으로 라우트를 생성하도록 설정

