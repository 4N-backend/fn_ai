spring:
  profiles:
    active: local
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5433/slack
    username: sa
    password: sa
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

  config:
    import:
      - "configserver:"
      - optional:file:.env[.properties]
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

management:
  endpoints:
    web:
      exposure:
        include: refresh

slack:
  bot:
    token: ${SLACK_BOT_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:18080/eureka/
