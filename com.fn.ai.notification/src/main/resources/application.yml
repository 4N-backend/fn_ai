spring:
  profiles:
    active: docker
  application:
    name: notification-service

  config:
    import:
      - "configserver:"
      - optional:file:.env[.properties]
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server

management:
  endpoints:
    web:
      exposure:
        include: refresh

slack:
  bot:
    token: ${SLACK_BOT_TOKEN}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:18080/eureka/
